<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>叶展铭 · 个人网站</title>
  <meta name="description" content="叶展铭的个人网站——物联网工程学生，嵌入式与 AI 编程爱好者。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 扫描线遮罩（全屏固定） -->
  <div class="scanlines" aria-hidden="true"></div>

  <!-- 霓虹粒子星空背景 -->
  <canvas id="bg" aria-hidden="true"></canvas>

  <!-- 吸顶导航 -->
  <header class="navbar" id="navbar">
    <div class="nav-inner">
      <a class="logo" href="#hero"><span class="logo-mark">&gt;_</span> <span id="logo-name">叶展铭</span></a>
      <nav class="nav-links" id="nav-links">
        <a href="#about">关于</a>
        <a href="#skills">技能</a>
        <a href="#projects">项目</a>
        <a href="#blog">博客</a>
        <a href="#contact" class="nav-cta">联系我</a>
      </nav>
      <button class="hamburger" id="hamburger" aria-label="打开菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <!-- Hero -->
    <section class="hero" id="hero">
      <div class="hero-inner">
        <div class="avatar" id="avatar" aria-hidden="true">叶</div>
        <h1 class="glitch" id="name" data-text="叶展铭">叶展铭</h1>
        <p class="en-name" id="en-name">ZhanMing YE</p>
        <p class="role" id="role">物联网工程学生 · 嵌入式 &amp; AI 编程</p>
        <p class="typing-wrap"><span id="typing"></span><span class="cursor">▍</span></p>
        <div class="hero-btns">
          <a href="#projects" class="btn btn-primary">看我的项目</a>
          <a href="#contact" class="btn btn-ghost">联系我</a>
        </div>
      </div>
      <a href="#about" class="scroll-hint" aria-label="向下滚动">▼</a>
    </section>

    <!-- 关于 -->
    <section class="section" id="about">
      <h2 class="section-title"><span class="accent">//</span> 关于我</h2>
      <div class="about-grid">
        <div class="about-text" id="about-text"></div>
        <ul class="timeline" id="timeline"></ul>
      </div>
    </section>

    <!-- 技能 -->
    <section class="section section-alt" id="skills">
      <h2 class="section-title"><span class="accent">//</span> 技能</h2>
      <div class="skill-grid" id="skill-grid"></div>
    </section>

    <!-- 项目 -->
    <section class="section" id="projects">
      <h2 class="section-title"><span class="accent">//</span> 项目</h2>
      <div class="project-grid" id="project-grid"></div>
    </section>

    <!-- 博客 -->
    <section class="section section-alt" id="blog">
      <h2 class="section-title"><span class="accent">//</span> 博客</h2>
      <div class="blog-list" id="blog-list"></div>
    </section>

    <!-- 联系 -->
    <section class="section" id="contact">
      <h2 class="section-title"><span class="accent">//</span> 联系我</h2>
      <p class="contact-intro">有想法想交流？欢迎随时找我。</p>
      <div class="contact-links">
        <button class="btn btn-primary" id="copy-email">📧 复制邮箱</button>
        <a class="btn btn-ghost" id="github-link" href="https://github.com/Yedeng-yzm" target="_blank" rel="noopener">GitHub</a>
        <span class="email" id="email" hidden>yezhanming@example.com</span>
      </div>
      <p class="contact-tip" id="copy-tip"></p>
    </section>
  </main>

  <footer class="footer">
    <p id="footer-text">© 2026 叶展铭 · 用代码连接硬件与世界</p>
  </footer>

  <script src="data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
